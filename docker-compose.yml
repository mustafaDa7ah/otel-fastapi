version: '3.8'

services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.86.0
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus metrics
      - "13133:13133" # Health check
    volumes:
      - ./collector/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    # depends_on:
    #   clickhouse:
    #     condition: service_healthy
    restart: on-failure

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://collector:4318
      - OTEL_SERVICE_NAME=fastapi-app
    depends_on:
      collector:
        condition: service_started
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - app-network
    healthcheck:
      test: echo stat | nc localhost 2181 || exit 1
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'  # Add this!
    ports:
      - "9092:9092"
    networks:
      - app-network
    healthcheck:
      test: nc -z localhost 9092 || exit 1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  kafka-consumer:
    build: .
    command: >
      sh -c "sleep 20 && python -m app.consumer_start"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://collector:4318
      - WORKER_ID=kafka-consumer-1
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
      collector:
        condition: service_started
    networks:
      - app-network
    restart: on-failure  # Add restart policy

  cube:
    image: cubejs/cube:latest
    ports:
      - "4000:4000"
    environment:
      - CUBEJS_DB_TYPE=clickhouse
      - CUBEJS_DB_HOST=clickhouse
      - CUBEJS_DB_PORT=9000
      - CUBEJS_DB_NAME=default
      - CUBEJS_DB_USER=default
      - CUBEJS_DB_PASS=
      - CUBEJS_DEV_MODE=true
    volumes:
      - ./cube:/cube/conf
    depends_on:
      - clickhouse

volumes:
  clickhouse_data:
  # grafana_data:

networks:
  app-network:
    driver: bridge