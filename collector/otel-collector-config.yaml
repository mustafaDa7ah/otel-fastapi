exporters:
  clickhouse:
    endpoint: tcp://clickhouse:9000
    database: otel
    username: default    
    password: ""         
    logs_table_name: otel_logs
    traces_table_name: otel_traces
    metrics_table_name: otel_metrics
    timeout: 5s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s